name: MCA Pipeline Manager

on:
  workflow_dispatch:
    inputs:
      action_type:
        type: choice
        description: 'Action to perform'
        options:
          - 'Scrape Statute'
          - 'Build MCA Structural Index'
          - 'Check Status & History Updates'
        default: 'Scrape Statute'
      statute_id:
        description: 'Statute ID (Required for Scrape Statute, e.g. 45-5-206)'
        required: false
      title_short:
        description: 'Short Title (Required for Scrape Statute, e.g. PFMA)'
        required: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Index
        if: ${{ github.event.inputs.action_type == 'Build MCA Structural Index' }}
        run: python index_mca.py

      - name: Check Status
        if: ${{ github.event.inputs.action_type == 'Check Status & History Updates' }}
        run: python check_status.py

      - name: Run Scraper Script
        if: ${{ github.event.inputs.action_type == 'Scrape Statute' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATUTE_ID: ${{ github.event.inputs.statute_id }}
          TITLE_SHORT: ${{ github.event.inputs.title_short }}
        run: |
          python scraper.py
          python check_status.py

      - name: Commit updated JSON data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Automated update via MCA Pipeline [${{ github.event.inputs.action_type }}]"
            git pull --rebase origin main
            git push
          fi
