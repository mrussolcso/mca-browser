name: Run Statute Scraper

on:
  workflow_dispatch:
    inputs:
      statute_id:
        description: 'Statute ID (e.g., 45-5-102)'
        required: true
      title_short:
        description: 'Short Title (e.g., Deliberate Homicide)'
        required: true

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STATUTE_ID: ${{ github.event.inputs.statute_id }}
          TITLE_SHORT: ${{ github.event.inputs.title_short }}
        run: python scraper.py

      - name: Commit updated JSON data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Automated update for statute ${{ github.event.inputs.statute_id }}"
            git pull --rebase origin main
            git push
          fi
