name: Scheduled MCA Indexer

on:
  schedule:
    # Runs automatically every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual triggers from the GitHub UI

jobs:
  run-indexer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preserve Previous Sitemap
        run: |
          if [ -f mca_sitemap_latest.json ]; then
            cp mca_sitemap_latest.json mca_sitemap_old.json
          fi

      - name: Run MCA Crawler
        run: python crawler.py

      - name: Generate Diff & Rescrape Queue
        run: |
          if [ -f mca_sitemap_old.json ]; then
            python diff_engine.py mca_sitemap_old.json mca_sitemap_latest.json
          else
            echo "No previous sitemap found. Skipping diff step."
          fi

      - name: Commit and Push Updated Sitemap & Diff Queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mca_sitemap_*.json diff_rescrape_queue.json || true
          git commit -m "Automated MCA Indexer Scan [skip ci]" || exit 0
          git push
